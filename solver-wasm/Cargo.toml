[package]
name = "astro-wasm-solver"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starfield = { version = "0.18.2", default-features = false }
wasm-bindgen = "0.2"
zodiacal = { version = "0.5.1", default-features = false, features = ["image-processing"] }
